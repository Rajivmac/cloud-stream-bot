<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stream Live Poll / Betting HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: transparent;
            margin: 0;
            padding: 16px;
            overflow: hidden;
            font-family: 'Chakra Petch', sans-serif;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        #poll-container {
            width: 490px;
            background: rgba(12, 16, 26, 0.95);
            border: 2px solid #28334f;
            border-top: 4px solid #00d2d3;
            border-radius: 12px;
            padding: 14px 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 25px rgba(0, 210, 211, 0.2);
            opacity: 0;
            transform: translateY(-25px) scale(0.96);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #poll-container.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .badge {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 3px 8px;
            border-radius: 5px;
            background: #00d2d3;
            color: #000;
        }

        .badge.locked { background: #ff4757; color: #fff; }

        .pool-badge {
            font-size: 13px;
            font-weight: 700;
            color: #f1c40f;
            font-family: 'Orbitron', sans-serif;
        }

        .poll-title {
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            margin: 0 0 12px 0;
            line-height: 1.3;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .opt-row {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .opt-meta {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
        }

        .progress-track {
            width: 100%;
            height: 22px;
            background: #171c2c;
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            border: 1px solid #232d46;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            padding-left: 8px;
            font-size: 11px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        .winner-banner {
            display: none;
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            color: #000;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .footer-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #7f8b9f;
            margin-top: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="poll-container">
        <div class="header-row">
            <span id="poll-badge" class="badge">VOTING LIVE</span>
            <span id="pool-amount" class="pool-badge">🪙 0 MAC-COINS</span>
        </div>

        <div id="poll-title" class="poll-title">Prediction</div>

        <div class="options-list" id="options-list"></div>

        <div class="footer-info">
            <span>Vote: <b>!bet &lt;number&gt; &lt;amount&gt;</b> or <b>!vote &lt;number&gt;</b></span>
            <span id="total-voters">Votes: 0</span>
        </div>

        <div id="winner-banner" class="winner-banner">🏆 WINNER DECLARED!</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById('poll-container');
        const badge = document.getElementById('poll-badge');
        const poolAmount = document.getElementById('pool-amount');
        const pollTitle = document.getElementById('poll-title');
        const optionsList = document.getElementById('options-list');
        const totalVoters = document.getElementById('total-voters');
        const winnerBanner = document.getElementById('winner-banner');

        const barColors = [
            'linear-gradient(90deg, #00d2d3, #0984e3)',
            'linear-gradient(90deg, #ff4757, #ff6b81)',
            'linear-gradient(90deg, #f1c40f, #e67e22)',
            'linear-gradient(90deg, #9b59b6, #8e44ad)',
            'linear-gradient(90deg, #2ecc71, #1abc9c)'
        ];

        socket.on('bet-update', (bet) => {
            if (!bet.isOpen) {
                container.classList.remove('active');
                winnerBanner.style.display = 'none';
                return;
            }

            container.classList.add('active');
            pollTitle.innerText = bet.title;
            poolAmount.innerText = `🪙 ${bet.totalPool || 0} MAC-COINS`;

            if (bet.locked) {
                badge.innerText = 'LOCKED 🔒';
                badge.classList.add('locked');
            } else {
                badge.innerText = 'VOTING LIVE 🟢';
                badge.classList.remove('locked');
            }

            totalVoters.innerText = `Total Votes: ${bet.totalVotes || 0}`;

            optionsList.innerHTML = '';
            bet.options.forEach((opt, idx) => {
                const color = barColors[idx % barColors.length];
                const row = document.createElement('div');
                row.className = 'opt-row';
                row.innerHTML = `
                    <div class="opt-meta">
                        <span>[${opt.id}] ${opt.name}</span>
                        <span>${opt.votes} votes (${opt.pct}%)</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" style="width: ${opt.pct}%; background: ${color};">
                            ${opt.pct > 12 ? opt.pct + '%' : ''}
                        </div>
                    </div>
                `;
                optionsList.appendChild(row);
            });
        });

        socket.on('bet-winner', (data) => {
            winnerBanner.innerText = `🏆 WINNER: ${data.winnerName}! (🪙 ${data.totalPool} Pool Paid)`;
            winnerBanner.style.display = 'block';
        });
    </script>
</body>
</html>

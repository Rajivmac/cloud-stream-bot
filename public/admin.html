<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Master Deck</title>
    <script src="https://cdn.jsdelivr.net/npm/obs-websocket-js@5.0.5/dist/obs-ws.min.js"></script>
    <style>
        /* CSS Same as before... (Dark Theme, Buttons, Grid) */
        :root { --bg: #0b0e14; --surface: #121722; --border: #202738; --green: #2ecc71; --orange: #f39c12; --red: #ff4757; --cyan: #00d2d3; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; display: flex; margin: 0; height: 100vh; overflow: hidden; }
        .sidebar { width: 140px; background: #0f131d; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 10px 6px; }
        .nav-btn { background: transparent; border: none; color: #7f8b9f; padding: 10px; cursor: pointer; text-align: left; }
        .nav-btn.active { background: var(--surface); color: #fff; border-left: 3px solid var(--cyan); }
        .main-viewport { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .tab-content { display: none; flex-direction: column; gap: 10px; } .tab-content.active { display: flex; }
        .card { background: var(--surface); border: 1px solid var(--border); padding: 12px; border-radius: 10px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .grid-dynamic { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
        button { padding: 10px; border: none; border-radius: 7px; color: white; cursor: pointer; font-weight: bold; }
        .btn-green { background: var(--green); color: #000; } .btn-red { background: var(--red); } .btn-cyan { background: var(--cyan); color:#000; }
        input, select, textarea { width: 100%; padding: 8px; background: #171c28; border: 1px solid #242c3f; color: white; margin-bottom: 6px; border-radius: 4px; box-sizing: border-box; }
        .status-badge { display: flex; align-items: center; gap: 5px; font-size: 11px; } .dot { width: 10px; height: 10px; border-radius: 50%; }
        .score-box { font-size: 32px; font-weight: 900; text-align: center; }
    </style>
</head>
<body>
    <div class="sidebar">
        <button class="nav-btn active" onclick="switchTab('deck')">🎮 Live Deck</button>
        <button class="nav-btn" onclick="switchTab('stats')">💀 Match Stats</button>
        <button class="nav-btn" onclick="switchTab('bet')">🎲 Predictions</button>
        <button class="nav-btn" onclick="switchTab('ai')">🤖 AI Controls</button>
    </div>

    <div class="main-viewport">
        <!-- Status Bar -->
        <div class="card" style="display:flex; justify-content:space-between; padding:8px;">
            <div class="status-badge"><span class="dot" id="stream-dot" style="background:var(--red);"></span> <span id="stream-text">Stream Off</span></div>
            <div class="status-badge"><span class="dot" id="obs-dot" style="background:var(--red);"></span> <span id="obs-text">OBS Off</span></div>
        </div>

        <!-- TAB 1: LIVE DECK (Manual Redeems) -->
        <div id="tab-deck" class="tab-content active">
            <div class="card">
                <h3>⚡ Local Media Redeems (Direct to OBS)</h3>
                <small style="color:var(--cyan);">Add local SSD paths in 'Add Item' to see buttons here.</small>
                <div class="grid-dynamic" id="triggers-container"></div>
            </div>
        </div>

        <!-- TAB 2: MATCH STATS (Win/Loss + Deaths + Timer) -->
        <div id="tab-stats" class="tab-content">
            <div class="card">
                <h3 style="text-align:center;">🏆 Ranked Streak (W - L)</h3>
                <div class="score-box" style="color:var(--cyan);"><span id="win-display">0</span> - <span id="loss-display">0</span></div>
                <div class="grid-2">
                    <button class="btn-green" onclick="socket.emit('admin-win-add')">+ 1 WIN</button>
                    <button class="btn-red" onclick="socket.emit('admin-loss-add')">+ 1 LOSS</button>
                </div>
            </div>
            
            <div class="card">
                <h3 style="text-align:center;">💀 Match Deaths</h3>
                <div class="score-box" id="death-display" style="color:var(--red);">0</div>
                <button class="btn-red" style="width:100%; margin-bottom:8px; font-size:20px;" onclick="socket.emit('admin-death-add')">+ 1 DEATH</button>
                <button style="background:#202738; width:100%;" onclick="socket.emit('admin-death-reset')">Reset Counters</button>
            </div>
        </div>

        <!-- TAB 3: POLLS / BETTING -->
        <div id="tab-bet" class="tab-content">
            <div class="card">
                <h3>🎲 Start Match Prediction</h3>
                <input type="text" id="poll-q" placeholder="Kaun Jeetega?">
                <input type="text" id="poll-opt1" value="Rajiv (Win)">
                <input type="text" id="poll-opt2" value="Enemy (Loss)">
                <button class="btn-cyan" style="width:100%;" onclick="startPoll()">🚀 Launch Poll</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const obs = new OBSWebSocket();
        let wasOnline = false;

        function switchTab(tab) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
        }

        // 🔊 Stream Health Audio Beep Logic
        function playStatusBeep(isOnline) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.connect(ctx.destination);
            if (isOnline) {
                // High Pitch Ting! (Stream ON)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
                osc.start(); osc.stop(ctx.currentTime + 0.2);
            } else {
                // Low Pitch Buzz! (Stream OFF / Disconnected)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.3);
                osc.start(); osc.stop(ctx.currentTime + 0.4);
            }
        }

        socket.on('stream-status', (data) => {
            const isOnline = data.status === 'online';
            if (isOnline !== wasOnline) {
                playStatusBeep(isOnline);
                wasOnline = isOnline;
            }
            document.getElementById('stream-dot').style.background = isOnline ? 'var(--green)' : 'var(--red)';
            document.getElementById('stream-text').innerText = isOnline ? 'Stream Live' : 'Stream Off';
        });

        // Update Stats
        socket.on('update-counter', (data) => {
            document.getElementById('death-display').innerText = data.count || 0;
            document.getElementById('win-display').innerText = data.wins || 0;
            document.getElementById('loss-display').innerText = data.losses || 0;
        });

        function startPoll() {
            const q = document.getElementById('poll-q').value || "Prediction";
            const o1 = document.getElementById('poll-opt1').value;
            const o2 = document.getElementById('poll-opt2').value;
            socket.emit('admin-start-bet', { title: q, options: [o1, o2] });
            alert("Poll Started! Viewers can type '!bet 1 50' in chat.");
        }

        // ⚡ OBS DIRECT MANUAL TRIGGER
        async function triggerLocalMedia(filePath) {
            try {
                if(!obs.connected) return alert("OBS is not connected!");
                // Direct command to OBS 5.x to change source file and make visible
                await obs.call('SetInputSettings', { inputName: 'MemePlayer', inputSettings: { local_file: filePath } });
            } catch(e) { console.log(e); }
        }

        async function connectOBS() {
            try {
                await obs.connect('ws://127.0.0.1:4455');
                document.getElementById('obs-dot').style.background = 'var(--green)';
                document.getElementById('obs-text').innerText = 'OBS Connected';
            } catch(e) {}
        }
        setInterval(() => { if (!obs.connected) connectOBS(); }, 5000);
        connectOBS();
    </script>
</body>
</html>

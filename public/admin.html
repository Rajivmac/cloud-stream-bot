<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Control Deck</title>
    <style>
        :root {
            --bg-color: #0d0f17;
            --card-bg: #161926;
            --text-color: #ffffff;
            --green: #2ecc71;
            --orange: #f39c12;
            --red: #ff4757;
            --blue: #3498db;
            --purple: #9b59b6;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .status-card {
            background: var(--card-bg);
            padding: 12px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .status-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
        .status-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: var(--orange);
            box-shadow: 0 0 10px var(--orange);
        }
        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
        }
        .section-title {
            font-size: 13px;
            color: #8c93a8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid-dynamic { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
        
        button {
            padding: 14px 10px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.96); }

        .btn-death-add { background: var(--red); font-size: 20px; grid-column: span 2; padding: 18px; }
        .btn-death-sub { background: #4a5568; }
        .btn-death-reset { background: #2d3748; }

        .btn-video { background: linear-gradient(135deg, #e67e22, #d35400); }
        .btn-sfx { background: linear-gradient(135deg, var(--purple), #8e44ad); }

        .counter-number {
            font-size: 42px;
            font-weight: 800;
            color: var(--red);
            text-align: center;
            margin: 5px 0 12px 0;
        }

        /* Add Trigger Form */
        input, select {
            width: 100%;
            padding: 10px;
            background: #24293d;
            border: 1px solid #373e5a;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .btn-submit {
            background: #27ae60;
            width: 100%;
            padding: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1. STATUS -->
        <div class="status-card">
            <div class="status-info">
                <div id="status-indicator" class="status-dot"></div>
                <span id="status-text">Connecting...</span>
            </div>
            <span style="font-size: 12px; color: #8c93a8;">Render Cloud</span>
        </div>

        <!-- 2. DEATH COUNTER -->
        <div class="card">
            <div class="section-title">💀 Death Counter</div>
            <div class="counter-number" id="death-display">0</div>
            <div class="grid-2">
                <button class="btn-death-add" onclick="socket.emit('admin-death-add')">+ 1 DEATH</button>
                <button class="btn-death-sub" onclick="socket.emit('admin-death-sub')">- 1 Death</button>
                <button class="btn-death-reset" onclick="socket.emit('admin-death-reset')">Reset (0)</button>
            </div>
        </div>

        <!-- 3. DYNAMIC TRIGGERS (Auto Generated Buttons) -->
        <div class="card">
            <div class="section-title">⚡ Interactive Triggers</div>
            <div class="grid-dynamic" id="triggers-container">
                <!-- Buttons will appear here automatically -->
            </div>
        </div>

        <!-- 4. ADD NEW TRIGGER FORM -->
        <div class="card">
            <div class="section-title">➕ Add New Trigger</div>
            <input type="text" id="trig-name" placeholder="Display Name (e.g. K.O Punch)">
            <input type="text" id="trig-cmd" placeholder="Chat Command (e.g. !ko)">
            <select id="trig-type">
                <option value="video">Video Meme (Cloudinary)</option>
                <option value="sfx">Sound Effect (Audio URL)</option>
            </select>
            <input type="text" id="trig-url" placeholder="Direct Media URL (.mp4 / .mp3)">
            <button class="btn-submit" onclick="addNewTrigger()">Save & Create Button</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const indicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const deathDisplay = document.getElementById('death-display');
        const triggersContainer = document.getElementById('triggers-container');

        socket.on('stream-status', (data) => {
            if (data.status === 'online') {
                indicator.style.backgroundColor = 'var(--green)';
                indicator.style.boxShadow = '0 0 12px var(--green)';
                statusText.innerText = 'Stream Online';
            } else if (data.status === 'retrying') {
                indicator.style.backgroundColor = 'var(--orange)';
                indicator.style.boxShadow = '0 0 12px var(--orange)';
                statusText.innerText = 'Searching Stream...';
            } else {
                indicator.style.backgroundColor = 'var(--red)';
                indicator.style.boxShadow = '0 0 12px var(--red)';
                statusText.innerText = 'Stream Offline';
            }
        });

        socket.on('update-counter', (data) => {
            deathDisplay.innerText = data.count;
        });

        // Dynamic Buttons Render
        socket.on('load-triggers', (triggers) => {
            triggersContainer.innerHTML = '';
            triggers.forEach(t => {
                const btn = document.createElement('button');
                btn.className = t.type === 'video' ? 'btn-video' : 'btn-sfx';
                btn.innerHTML = `${t.type === 'video' ? '🎬' : '🔊'} ${t.name}<br><small style="font-size:11px; opacity:0.8;">${t.cmd}</small>`;
                btn.onclick = () => {
                    if (t.type === 'video') socket.emit('admin-play-meme', { mediaUrl: t.url });
                    if (t.type === 'sfx') socket.emit('admin-play-sfx', { sfxUrl: t.url });
                };
                triggersContainer.appendChild(btn);
            });
        });

        function addNewTrigger() {
            const name = document.getElementById('trig-name').value.trim();
            const cmd = document.getElementById('trig-cmd').value.trim().toLowerCase();
            const type = document.getElementById('trig-type').value;
            const url = document.getElementById('trig-url').value.trim();

            if (!name || !cmd || !url) {
                alert('Bhai saari fields bharna zaroori hai!');
                return;
            }

            socket.emit('admin-add-trigger', { name, cmd, type, url });

            // Clear Inputs
            document.getElementById('trig-name').value = '';
            document.getElementById('trig-cmd').value = '';
            document.getElementById('trig-url').value = '';
        }
    </script>
</body>
</html>

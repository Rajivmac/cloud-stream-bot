<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Master Deck</title>
    <script src="https://cdn.jsdelivr.net/npm/obs-websocket-js@5.0.5/dist/obs-ws.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0d14;
            --card-bg: #141724;
            --active-tab: #22283d;
            --green: #2ecc71;
            --orange: #f39c12;
            --red: #ff4757;
            --blue: #3498db;
            --purple: #9b59b6;
            --scene-btn: #34495e;
        }
        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
        
        .status-card {
            background: var(--card-bg);
            padding: 10px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .status-info { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 13px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 10px var(--orange); }

        .tab-bar {
            display: flex;
            gap: 6px;
            background: #11131c;
            padding: 6px;
            border-radius: 12px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 4px;
            font-size: 12px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #8c93a8;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: var(--active-tab);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .tab-content { display: none; flex-direction: column; gap: 12px; }
        .tab-content.active { display: flex; }

        .card { background: var(--card-bg); padding: 14px; border-radius: 12px; }
        .section-title { font-size: 12px; color: #8c93a8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-weight: 700; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .grid-dynamic { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
        
        button {
            padding: 14px 10px;
            font-size: 14px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.96); }

        .btn-mic {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            border-radius: 10px;
            font-weight: 800;
        }
        .mic-unmuted { background: var(--green); box-shadow: 0 0 15px rgba(46, 204, 113, 0.4); }
        .mic-muted { background: var(--red); box-shadow: 0 0 15px rgba(255, 71, 87, 0.5); }

        .btn-scene { background: var(--scene-btn); border-left: 4px solid var(--blue); min-height: 55px; }
        .btn-video { background: linear-gradient(135deg, #e67e22, #d35400); min-height: 60px; }
        .btn-sfx { background: linear-gradient(135deg, #9b59b6, #8e44ad); min-height: 60px; }

        .counter-big-display {
            font-size: 64px;
            font-weight: 900;
            color: var(--red);
            text-align: center;
            margin: 5px 0 15px 0;
        }
        .timer-display {
            font-size: 38px;
            font-weight: 900;
            color: #00d2d3;
            text-align: center;
            margin: 5px 0 15px 0;
            font-family: monospace;
        }

        .btn-death-add { background: var(--red); font-size: 22px; padding: 18px; width: 100%; margin-bottom: 10px; }
        .btn-sub { background: #4a5568; }
        .btn-reset { background: #2d3748; }

        select, input {
            width: 100%;
            padding: 11px;
            background: #202538;
            border: 1px solid #353c58;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .btn-submit { background: var(--blue); width: 100%; padding: 13px; font-size: 15px; }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="status-card">
            <div class="status-info">
                <div id="status-indicator" class="status-dot"></div>
                <span id="status-text">Cloud Connecting...</span>
            </div>
            <div class="status-info">
                <span id="obs-status-text" style="color: #8c93a8;">OBS: Offline</span>
            </div>
        </div>

        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('deck')">🎮 Live Deck</button>
            <button class="tab-btn" onclick="switchTab('counter')">💀 Deaths</button>
            <button class="tab-btn" onclick="switchTab('timer')">⏱️ Playtime</button>
            <button class="tab-btn" onclick="switchTab('customizer')">🎨 Settings</button>
            <button class="tab-btn" onclick="switchTab('add')">➕ Add</button>
        </div>

        <!-- TAB 1: LIVE DECK -->
        <div id="tab-deck" class="tab-content active">
            <div class="card">
                <div class="section-title">🎙️ Audio Controls</div>
                <button id="mic-btn" class="btn-mic mic-unmuted" onclick="toggleMic()">🎙️ MIC IS LIVE</button>
            </div>
            <div class="card">
                <div class="section-title">🎬 OBS Scenes</div>
                <div class="grid-dynamic" id="scenes-container"></div>
            </div>
            <div class="card">
                <div class="section-title">⚡ Meme & Sound Deck</div>
                <div class="grid-dynamic" id="triggers-container"></div>
            </div>
        </div>

        <!-- TAB 2: DEATH COUNTER -->
        <div id="tab-counter" class="tab-content">
            <div class="card">
                <div class="section-title" style="text-align:center;">💀 Match Death Count</div>
                <div class="counter-big-display" id="death-display">0</div>
                <button class="btn-death-add" onclick="socket.emit('admin-death-add')">+ 1 DEATH</button>
                <div class="grid-2">
                    <button class="btn-sub" onclick="socket.emit('admin-death-sub')">- 1 Death</button>
                    <button class="btn-reset" onclick="socket.emit('admin-death-reset')">Reset (0)</button>
                </div>
            </div>
        </div>

        <!-- TAB 3: PLAYTIME TIMER -->
        <div id="tab-timer" class="tab-content">
            <div class="card">
                <div class="section-title" style="text-align:center;">⏱️ Game Completion Time</div>
                <div class="timer-display" id="admin-timer-display">00h 00m 00s</div>
                <div class="grid-3">
                    <button style="background:var(--green);" onclick="socket.emit('admin-timer-start')">▶ Resume</button>
                    <button style="background:var(--orange);" onclick="socket.emit('admin-timer-pause')">⏸ Pause</button>
                    <button class="btn-reset" onclick="socket.emit('admin-timer-reset')">🔄 Reset</button>
                </div>
                <small style="color:#8c93a8; display:block; margin-top:12px; text-align:center;">
                    *Stream live hote hi timer auto-start ho jata hai aur stream band hone par auto-pause.
                </small>
            </div>
        </div>

        <!-- TAB 4: SETTINGS & FONTS -->
        <div id="tab-customizer" class="tab-content">
            <div class="card">
                <div class="section-title">🎨 Independent Fonts & Styles</div>
                
                <label style="font-size:12px; color:#8c93a8;">Death Counter Font</label>
                <select id="cust-counter-font" onchange="applyStyles()">
                    <option value="Teko">Teko (Aggressive)</option>
                    <option value="Orbitron">Orbitron (Sci-Fi)</option>
                    <option value="Russo One">Russo One (Esports Chunky)</option>
                    <option value="Black Ops One">Black Ops One (Combat)</option>
                    <option value="Chakra Petch">Chakra Petch (Modern HUD)</option>
                    <option value="Bangers">Bangers (Comic Pop)</option>
                    <option value="Press Start 2P">Retro 8-Bit</option>
                    <option value="Share Tech Mono">Share Tech Mono (Terminal)</option>
                </select>

                <label style="font-size:12px; color:#8c93a8;">Date & Time Font</label>
                <select id="cust-clock-font" onchange="applyStyles()">
                    <option value="Share Tech Mono">Share Tech Mono (Terminal)</option>
                    <option value="Chakra Petch">Chakra Petch (Modern HUD)</option>
                    <option value="Orbitron">Orbitron (Sci-Fi)</option>
                    <option value="Teko">Teko (Aggressive)</option>
                    <option value="Russo One">Russo One (Esports Chunky)</option>
                </select>

                <label style="font-size:12px; color:#8c93a8;">Playtime Timer Font</label>
                <select id="cust-timer-font" onchange="applyStyles()">
                    <option value="Orbitron">Orbitron (Sci-Fi)</option>
                    <option value="Chakra Petch">Chakra Petch (Modern HUD)</option>
                    <option value="Russo One">Russo One (Esports Chunky)</option>
                    <option value="Share Tech Mono">Share Tech Mono (Terminal)</option>
                    <option value="Black Ops One">Black Ops One (Combat)</option>
                </select>

                <div class="grid-2">
                    <div>
                        <label style="font-size:12px; color:#8c93a8;">Counter Icon</label>
                        <select id="cust-icon" onchange="applyStyles()">
                            <option value="💀">💀 Skull</option>
                            <option value="🔥">🔥 Fire</option>
                            <option value="☠️">☠️ Crossbones</option>
                            <option value="🥊">🥊 Boxing</option>
                            <option value="🩸">🩸 Blood</option>
                            <option value="👑">👑 Crown</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size:12px; color:#8c93a8;">Theme Color</label>
                        <select id="cust-color" onchange="applyStyles()">
                            <option value="#ff4757">Blood Red</option>
                            <option value="#00d2d3">Cyan / Neon</option>
                            <option value="#ffa502">Flame Gold</option>
                            <option value="#2ed573">Acid Green</option>
                            <option value="#a55eea">Cyber Purple</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="section-title">🔌 OBS WebSocket Connection</div>
                <input type="text" id="obs-ip" placeholder="OBS IP (Default: 127.0.0.1)" value="127.0.0.1">
                <input type="text" id="obs-port" placeholder="Port (Default: 4455)" value="4455">
                <input type="password" id="obs-pass" placeholder="Password (Empty if none)">
                <input type="text" id="obs-mic-name" placeholder="Mic Name in OBS" value="Mic/Aux">
                <button class="btn-submit" onclick="connectOBS()">Connect to OBS</button>
            </div>
        </div>

        <!-- TAB 5: ADD NEW -->
        <div id="tab-add" class="tab-content">
            <div class="card">
                <div class="section-title">➕ Add New Item</div>
                <select id="trig-type" onchange="toggleFormFields()">
                    <option value="scene">🎬 OBS Scene Switcher</option>
                    <option value="video">🎥 Video Meme (Cloudinary URL)</option>
                    <option value="sfx">🔊 Sound Effect (Audio MP3 URL)</option>
                </select>

                <input type="text" id="trig-name" placeholder="Display Name">
                <input type="text" id="trig-scene-name" placeholder="Exact Scene Name in OBS">
                <input type="text" id="trig-cmd" placeholder="Chat Command (e.g. !ko)" style="display:none;">
                <input type="text" id="trig-url" placeholder="Direct Media URL" style="display:none;">
                
                <button class="btn-submit" onclick="addNewTrigger()">Add to Live Deck</button>
            </div>
        </div>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const obs = new OBSWebSocket();

        const indicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const obsStatusText = document.getElementById('obs-status-text');
        const deathDisplay = document.getElementById('death-display');
        const adminTimerDisplay = document.getElementById('admin-timer-display');
        const scenesContainer = document.getElementById('scenes-container');
        const triggersContainer = document.getElementById('triggers-container');
        const micBtn = document.getElementById('mic-btn');

        async function connectOBS() {
            const ip = document.getElementById('obs-ip').value.trim() || '127.0.0.1';
            const port = document.getElementById('obs-port').value.trim() || '4455';
            const password = document.getElementById('obs-pass').value.trim();

            try {
                obsStatusText.innerText = 'OBS: Connecting...';
                await obs.connect(`ws://${ip}:${port}`, password || undefined);
                obsStatusText.innerText = 'OBS: Connected ✅';
                obsStatusText.style.color = 'var(--green)';
                updateMicState();
            } catch (err) {
                obsStatusText.innerText = 'OBS: Offline ❌';
                obsStatusText.style.color = 'var(--red)';
            }
        }

        async function updateMicState() {
            try {
                const micName = document.getElementById('obs-mic-name').value.trim() || 'Mic/Aux';
                const { inputMuted } = await obs.call('GetInputMute', { inputName: micName });
                setMicButtonUI(inputMuted);
            } catch (e) {}
        }

        function setMicButtonUI(muted) {
            if (muted) {
                micBtn.className = 'btn-mic mic-muted';
                micBtn.innerHTML = '🔇 MIC MUTED';
            } else {
                micBtn.className = 'btn-mic mic-unmuted';
                micBtn.innerHTML = '🎙️ MIC IS LIVE';
            }
        }

        async function toggleMic() {
            const micName = document.getElementById('obs-mic-name').value.trim() || 'Mic/Aux';
            try {
                const res = await obs.call('ToggleInputMute', { inputName: micName });
                setMicButtonUI(res.inputMuted);
            } catch (err) {
                alert('OBS connect nahi hai!');
            }
        }

        obs.on('InputMuteStateChanged', (data) => {
            const micName = document.getElementById('obs-mic-name').value.trim() || 'Mic/Aux';
            if (data.inputName === micName) setMicButtonUI(data.inputMuted);
        });

        async function switchScene(sceneName) {
            try {
                await obs.call('SetCurrentProgramScene', { sceneName });
            } catch (err) {
                alert(`Scene '${sceneName}' nahi mila!`);
            }
        }

        connectOBS();

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            const tabMap = { 'deck': 0, 'counter': 1, 'timer': 2, 'customizer': 3, 'add': 4 };
            document.querySelectorAll('.tab-btn')[tabMap[tabName]].classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        function toggleFormFields() {
            const type = document.getElementById('trig-type').value;
            document.getElementById('trig-scene-name').style.display = type === 'scene' ? 'block' : 'none';
            document.getElementById('trig-cmd').style.display = type === 'scene' ? 'none' : 'block';
            document.getElementById('trig-url').style.display = type === 'scene' ? 'none' : 'block';
        }

        function formatTime(totalSeconds) {
            const h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            const s = (totalSeconds % 60).toString().padStart(2, '0');
            return `${h}h ${m}m ${s}s`;
        }

        socket.on('timer-tick', (data) => {
            adminTimerDisplay.innerText = formatTime(data.seconds);
        });

        socket.on('stream-status', (data) => {
            if (data.status === 'online') {
                indicator.style.background = 'var(--green)';
                indicator.style.boxShadow = '0 0 10px var(--green)';
                statusText.innerText = 'Stream Online';
            } else if (data.status === 'retrying') {
                indicator.style.background = 'var(--orange)';
                indicator.style.boxShadow = '0 0 10px var(--orange)';
                statusText.innerText = 'Searching Stream...';
            } else {
                indicator.style.background = 'var(--red)';
                indicator.style.boxShadow = '0 0 10px var(--red)';
                statusText.innerText = 'Stream Offline';
            }
        });

        socket.on('update-counter', (data) => deathDisplay.innerText = data.count);

        socket.on('update-styles', (data) => {
            if (data.counterIcon) document.getElementById('cust-icon').value = data.counterIcon;
            if (data.counterFont) document.getElementById('cust-counter-font').value = data.counterFont;
            if (data.clockFont) document.getElementById('cust-clock-font').value = data.clockFont;
            if (data.timerFont) document.getElementById('cust-timer-font').value = data.timerFont;
            if (data.themeColor) document.getElementById('cust-color').value = data.themeColor;
        });

        function applyStyles() {
            socket.emit('admin-change-styles', {
                counterIcon: document.getElementById('cust-icon').value,
                counterFont: document.getElementById('cust-counter-font').value,
                clockFont: document.getElementById('cust-clock-font').value,
                timerFont: document.getElementById('cust-timer-font').value,
                themeColor: document.getElementById('cust-color').value
            });
        }

        socket.on('load-triggers', (triggers) => {
            scenesContainer.innerHTML = '';
            triggersContainer.innerHTML = '';

            triggers.forEach(t => {
                if (t.type === 'scene') {
                    const btn = document.createElement('button');
                    btn.className = 'btn-scene';
                    btn.innerHTML = `🖥️ ${t.name}<br><small style="font-size:10px; opacity:0.7;">[${t.sceneName}]</small>`;
                    btn.onclick = () => switchScene(t.sceneName);
                    scenesContainer.appendChild(btn);
                } else {
                    const btn = document.createElement('button');
                    btn.className = t.type === 'video' ? 'btn-video' : 'btn-sfx';
                    btn.innerHTML = `${t.type === 'video' ? '🎬' : '🔊'} ${t.name}<br><small style="font-size:10px; opacity:0.8;">${t.cmd}</small>`;
                    btn.onclick = () => {
                        if (t.type === 'video') socket.emit('admin-play-meme', { mediaUrl: t.url });
                        if (t.type === 'sfx') socket.emit('admin-play-sfx', { sfxUrl: t.url });
                    };
                    triggersContainer.appendChild(btn);
                }
            });
        });

        function addNewTrigger() {
            const type = document.getElementById('trig-type').value;
            const name = document.getElementById('trig-name').value.trim();

            if (type === 'scene') {
                const sceneName = document.getElementById('trig-scene-name').value.trim();
                if (!name || !sceneName) return alert('Name & Scene required');
                socket.emit('admin-add-trigger', { name, type, sceneName });
            } else {
                const cmd = document.getElementById('trig-cmd').value.trim().toLowerCase();
                const url = document.getElementById('trig-url').value.trim();
                if (!name || !cmd || !url) return alert('All fields required');
                socket.emit('admin-add-trigger', { name, type, cmd, url });
            }

            document.getElementById('trig-name').value = '';
            document.getElementById('trig-scene-name').value = '';
            document.getElementById('trig-cmd').value = '';
            document.getElementById('trig-url').value = '';
            switchTab('deck');
        }
    </script>
</body>
</html>

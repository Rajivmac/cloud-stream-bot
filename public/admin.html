<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Master Deck</title>
    <style>
        :root {
            --bg-color: #0d0f17;
            --card-bg: #161926;
            --active-tab: #24293d;
            --green: #2ecc71;
            --orange: #f39c12;
            --red: #ff4757;
            --blue: #3498db;
            --purple: #9b59b6;
        }
        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
        
        /* Status Bar */
        .status-card {
            background: var(--card-bg);
            padding: 10px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .status-info { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 10px var(--orange); }

        /* Navigation Tabs */
        .tab-bar {
            display: flex;
            gap: 8px;
            background: #11141f;
            padding: 6px;
            border-radius: 12px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 6px;
            font-size: 13px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #8c93a8;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: var(--active-tab);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        /* Views / Sections */
        .tab-content { display: none; flex-direction: column; gap: 12px; }
        .tab-content.active { display: flex; }

        .card { background: var(--card-bg); padding: 14px; border-radius: 12px; }
        .section-title { font-size: 12px; color: #8c93a8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-weight: 700; }
        
        /* Buttons & Grid */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid-dynamic { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 10px; 
            max-height: 55vh;
            overflow-y: auto;
            padding-right: 2px;
        }
        
        button {
            padding: 14px 10px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.96); }

        .btn-death-add { background: var(--red); font-size: 22px; grid-column: span 2; padding: 18px; }
        .btn-death-sub { background: #4a5568; }
        .btn-death-reset { background: #2d3748; }

        .btn-video { background: linear-gradient(135deg, #e67e22, #d35400); min-height: 65px; }
        .btn-sfx { background: linear-gradient(135deg, #9b59b6, #8e44ad); min-height: 65px; }

        .counter-number { font-size: 46px; font-weight: 800; color: var(--red); text-align: center; margin: 4px 0 10px 0; }
        
        /* Inputs */
        select, input {
            width: 100%;
            padding: 11px;
            background: #24293d;
            border: 1px solid #373e5a;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .btn-submit { background: var(--blue); width: 100%; padding: 13px; font-size: 15px; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Status Bar -->
        <div class="status-card">
            <div class="status-info">
                <div id="status-indicator" class="status-dot"></div>
                <span id="status-text">Connecting...</span>
            </div>
            <span style="font-size:12px; color:#8c93a8;">Render Live</span>
        </div>

        <!-- Tab Navigation Bar -->
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('deck')">🎮 Live Deck</button>
            <button class="tab-btn" onclick="switchTab('customizer')">🎨 Customizer</button>
            <button class="tab-btn" onclick="switchTab('add')">➕ Add Trigger</button>
        </div>

        <!-- ================= TAB 1: LIVE DECK (FRONT VIEW) ================= -->
        <div id="tab-deck" class="tab-content active">
            <!-- Counter Controls -->
            <div class="card">
                <div class="section-title">💀 Counter Controls</div>
                <div class="counter-number" id="death-display">0</div>
                <div class="grid-2">
                    <button class="btn-death-add" onclick="socket.emit('admin-death-add')">+ 1 DEATH</button>
                    <button class="btn-death-sub" onclick="socket.emit('admin-death-sub')">- 1 Death</button>
                    <button class="btn-death-reset" onclick="socket.emit('admin-death-reset')">Reset (0)</button>
                </div>
            </div>

            <!-- Dynamic Triggers Grid -->
            <div class="card">
                <div class="section-title">⚡ Sound & Video Deck</div>
                <div class="grid-dynamic" id="triggers-container"></div>
            </div>
        </div>

        <!-- ================= TAB 2: OVERLAY CUSTOMIZER ================= -->
        <div id="tab-customizer" class="tab-content">
            <div class="card">
                <div class="section-title">🎨 Counter Visual Style</div>
                
                <label style="font-size:12px; color:#8c93a8;">Counter Icon</label>
                <select id="cust-icon" onchange="applyStyles()">
                    <option value="💀">💀 Skull</option>
                    <option value="🔥">🔥 Fire / Flame</option>
                    <option value="☠️️">☠️ Crossbones</option>
                    <option value="🥊">🥊 Boxing Glove</option>
                    <option value="🩸">🩸 Blood Drop</option>
                    <option value="👑">👑 Crown</option>
                </select>

                <label style="font-size:12px; color:#8c93a8;">Font Family</label>
                <select id="cust-font" onchange="applyStyles()">
                    <option value="Teko">Teko (Aggressive)</option>
                    <option value="Orbitron">Orbitron (Sci-Fi)</option>
                    <option value="Bangers">Bangers (Comic)</option>
                    <option value="Press Start 2P">Retro 8-Bit</option>
                </select>

                <label style="font-size:12px; color:#8c93a8;">Theme Accent Color</label>
                <select id="cust-color" onchange="applyStyles()">
                    <option value="#ff4757">Blood Red</option>
                    <option value="#00d2d3">Cyan / Neon Blue</option>
                    <option value="#ffa502">Flame Gold / Orange</option>
                    <option value="#2ed573">Acid Green</option>
                    <option value="#a55eea">Cyber Purple</option>
                </select>
            </div>
        </div>

        <!-- ================= TAB 3: ADD NEW TRIGGER ================= -->
        <div id="tab-add" class="tab-content">
            <div class="card">
                <div class="section-title">➕ Create New Trigger</div>
                <input type="text" id="trig-name" placeholder="Display Name (e.g. KO Punch)">
                <input type="text" id="trig-cmd" placeholder="Chat Command (e.g. !ko)">
                <select id="trig-type">
                    <option value="video">Video Meme (Cloudinary URL)</option>
                    <option value="sfx">Sound Effect (Audio MP3 URL)</option>
                </select>
                <input type="text" id="trig-url" placeholder="Direct Media URL (.mp4 / .mp3)">
                <button class="btn-submit" onclick="addNewTrigger()">Create Trigger Button</button>
            </div>
        </div>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const indicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const deathDisplay = document.getElementById('death-display');
        const triggersContainer = document.getElementById('triggers-container');

        // Tab Switching Logic
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'deck') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-deck').classList.add('active');
            } else if (tabName === 'customizer') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-customizer').classList.add('active');
            } else if (tabName === 'add') {
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
                document.getElementById('tab-add').classList.add('active');
            }
        }

        // Live Status
        socket.on('stream-status', (data) => {
            if (data.status === 'online') {
                indicator.style.background = 'var(--green)';
                indicator.style.boxShadow = '0 0 10px var(--green)';
                statusText.innerText = 'Stream Online';
            } else if (data.status === 'retrying') {
                indicator.style.background = 'var(--orange)';
                indicator.style.boxShadow = '0 0 10px var(--orange)';
                statusText.innerText = 'Searching Stream...';
            } else {
                indicator.style.background = 'var(--red)';
                indicator.style.boxShadow = '0 0 10px var(--red)';
                statusText.innerText = 'Stream Offline';
            }
        });

        // Counter & Customizer Listeners
        socket.on('update-counter', (data) => deathDisplay.innerText = data.count);

        socket.on('update-counter-style', (settings) => {
            if (settings.icon) document.getElementById('cust-icon').value = settings.icon;
            if (settings.font) document.getElementById('cust-font').value = settings.font;
            if (settings.color) document.getElementById('cust-color').value = settings.color;
        });

        function applyStyles() {
            const icon = document.getElementById('cust-icon').value;
            const font = document.getElementById('cust-font').value;
            const color = document.getElementById('cust-color').value;
            socket.emit('admin-change-style', { icon, font, color });
        }

        // Load Dynamic Buttons into Deck
        socket.on('load-triggers', (triggers) => {
            triggersContainer.innerHTML = '';
            triggers.forEach(t => {
                const btn = document.createElement('button');
                btn.className = t.type === 'video' ? 'btn-video' : 'btn-sfx';
                btn.innerHTML = `${t.type === 'video' ? '🎬' : '🔊'} ${t.name}<br><small style="font-size:11px; opacity:0.8;">${t.cmd}</small>`;
                btn.onclick = () => {
                    if (t.type === 'video') socket.emit('admin-play-meme', { mediaUrl: t.url });
                    if (t.type === 'sfx') socket.emit('admin-play-sfx', { sfxUrl: t.url });
                };
                triggersContainer.appendChild(btn);
            });
        });

        // Add Trigger & Auto Switch to Deck
        function addNewTrigger() {
            const name = document.getElementById('trig-name').value.trim();
            const cmd = document.getElementById('trig-cmd').value.trim().toLowerCase();
            const type = document.getElementById('trig-type').value;
            const url = document.getElementById('trig-url').value.trim();

            if (!name || !cmd || !url) return alert('Saari fields bharna zaroori hai!');
            
            socket.emit('admin-add-trigger', { name, cmd, type, url });
            
            document.getElementById('trig-name').value = '';
            document.getElementById('trig-cmd').value = '';
            document.getElementById('trig-url').value = '';

            // Naya button banne ke baad automatic Deck tab par le jayega
            switchTab('deck');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unified Stream Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden;
            background: transparent;
            width: 1920px; height: 1080px; /* Full 1080p Canvas */
            position: relative;
            font-family: 'Chakra Petch', sans-serif;
            color: #fff;
        }

        /* --- 1. HUD (Clock & Playtime) - TOP LEFT --- */
        #hud-container {
            position: absolute; top: 20px; left: 20px;
            display: flex; gap: 10px; flex-direction: column;
        }
        .hud-line {
            display: inline-flex; align-items: center; gap: 16px;
            background: rgba(10, 13, 20, 0.94);
            border: 2px solid #ff4757; border-left: 6px solid #ff4757; border-radius: 8px;
            padding: 10px 24px; font-family: 'Share Tech Mono', monospace; font-size: 26px; font-weight: 700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .live-dot { width: 12px; height: 12px; background-color: #2ecc71; border-radius: 50%; box-shadow: 0 0 12px #2ecc71; animation: pulse 1.5s infinite; }
        .timer-paused { background-color: #e74c3c !important; box-shadow: 0 0 10px #e74c3c !important; animation: none; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.4; } }

        /* --- 2. POLL / BETTING - TOP RIGHT --- */
        #poll-container {
            position: absolute; top: 20px; right: 20px; width: 400px;
            background: rgba(12, 16, 26, 0.95); border: 2px solid #28334f; border-top: 4px solid #00d2d3; border-radius: 12px;
            padding: 14px 18px; box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            opacity: 0; transform: translateY(-25px); transition: all 0.4s ease;
        }
        #poll-container.active { opacity: 1; transform: translateY(0); }
        .poll-title { font-size: 17px; font-weight: 700; margin-bottom: 12px; }
        .progress-track { width: 100%; height: 20px; background: #171c2c; border-radius: 5px; overflow: hidden; margin-top: 3px; margin-bottom: 8px; }
        .progress-fill { height: 100%; display: flex; align-items: center; padding-left: 8px; font-size: 11px; font-weight: 800; text-shadow: 0 1px 2px #000; }
        
        /* --- 3. MEME & VIDEO - CENTER --- */
        #video-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            max-width: 80vw; max-height: 70vh; display: none; border-radius: 12px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.9); border: 2px solid rgba(255, 255, 255, 0.1);
        }
        #video-container video { width: 100%; height: 100%; display: block; border-radius: 10px; }
        #redeem-card {
            position: absolute; top: 20%; left: 50%; transform: translate(-50%, -30px);
            background: rgba(10, 14, 24, 0.95); border: 2px solid #00d2d3; border-bottom: 4px solid #00d2d3; border-radius: 12px;
            padding: 10px 28px; text-align: center; opacity: 0; transition: all 0.35s ease; pointer-events: none;
        }
        #redeem-card.active { opacity: 1; transform: translate(-50%, 0); }

        /* --- 4. ALERTS & AI BUBBLE - BOTTOM CENTER --- */
        #bottom-center {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        #alert-box {
            display: none; align-items: center; gap: 16px; border-radius: 18px; padding: 16px 22px; width: max-content;
            background: linear-gradient(135deg, #0984e3, #00cec9); border: 3px solid #74b9ff;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7); animation: popIn 0.35s ease;
        }
        #ai-container {
            display: none; align-items: flex-start; gap: 16px; border-radius: 16px; padding: 16px 20px; max-width: 550px;
            background: rgba(14, 18, 28, 0.96); border: 2px solid #00d2d3;
            box-shadow: 0 8px 30px rgba(0, 210, 211, 0.4); animation: popIn 0.3s ease;
        }
        @keyframes popIn { 0% { transform: scale(0.7) translateY(20px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        .avatar-img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; flex-shrink: 0; }
        .talking-pulse { animation: pulseGlow 0.85s infinite alternate; border-color: #00d2d3; }
        @keyframes pulseGlow { 100% { box-shadow: 0 0 25px #00d2d3; transform: scale(1.06); } }
    </style>
</head>
<body>

    <!-- HUD -->
    <div id="hud-container">
        <div class="hud-line">
            <div id="timer-dot" class="live-dot timer-paused"></div>
            <span style="color: #a4b0be; font-size: 20px;">PLAYTIME:</span>
            <span id="time-text" style="color: #ff4757;">00h 00m 00s</span>
        </div>
    </div>

    <!-- POLL -->
    <div id="poll-container">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
            <b id="poll-badge" style="background:#00d2d3; color:#000; padding:3px 8px; border-radius:4px; font-size:12px;">VOTING LIVE</b>
            <b id="pool-amount" style="color:#f1c40f;">🪙 0</b>
        </div>
        <div id="poll-title" class="poll-title">Prediction</div>
        <div id="options-list"></div>
    </div>

    <!-- MEMES -->
    <div id="redeem-card">
        <div style="font-size:24px; font-weight:800;"><span id="user-name" style="color:#f1c40f;">User</span> redeemed</div>
        <div id="item-name" style="color:#00d2d3; font-size:16px;">Item</div>
    </div>
    <div id="video-container"><video id="meme-video" playsinline></video></div>
    <audio id="sfx-audio"></audio>

    <!-- ALERTS & AI -->
    <div id="bottom-center">
        <div id="alert-box">
            <img id="alert-user-img" class="avatar-img" src="">
            <div>
                <div style="font-weight:900; font-size:15px;" id="alert-title">ALERT</div>
                <div style="font-size:15px; font-weight:700;" id="alert-msg">Message</div>
            </div>
        </div>
        <div id="ai-container">
            <img id="ai-avatar" class="avatar-img" src="">
            <div>
                <div id="ai-name" style="color:#00d2d3; font-weight:800;">AI</div>
                <div id="ai-text" style="font-size:16px; font-weight:600;">Text</div>
            </div>
        </div>
    </div>

    <audio id="tts-audio" style="display:none;"></audio>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        // Timer Logic
        socket.on('timer-tick', (data) => {
            const h = Math.floor(data.seconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((data.seconds % 3600) / 60).toString().padStart(2, '0');
            const s = (data.seconds % 60).toString().padStart(2, '0');
            document.getElementById('time-text').innerText = `${h}h ${m}m${s}s`;
            document.getElementById('timer-dot').className = data.running ? 'live-dot' : 'live-dot timer-paused';
        });

        // Poll Logic
        const barColors = ['#0984e3', '#ff6b81', '#e67e22', '#8e44ad'];
        socket.on('bet-update', (bet) => {
            const pc = document.getElementById('poll-container');
            if (!bet.isOpen) return pc.classList.remove('active');
            pc.classList.add('active');
            document.getElementById('poll-title').innerText = bet.title;
            document.getElementById('pool-amount').innerText = `🪙 ${bet.totalPool}`;
            
            const list = document.getElementById('options-list');
            list.innerHTML = '';
            bet.options.forEach((opt, idx) => {
                const color = barColors[idx % barColors.length];
                list.innerHTML += `
                    <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:700;">
                        <span>[${opt.id}]${opt.name}</span><span>${opt.votes} votes (${opt.pct}%)</span>
                    </div>
                    <div class="progress-track"><div class="progress-fill" style="width:${opt.pct}\%; background:${color};"></div></div>
                `;
            });
        });

        // Memes & SFX
        const vBox = document.getElementById('video-container'), vid = document.getElementById('meme-video');
        const sfx = document.getElementById('sfx-audio'), rCard = document.getElementById('redeem-card');
        
        function showRedeem(user, item) {
            document.getElementById('user-name').innerText = user;
            document.getElementById('item-name').innerText = item;
            rCard.classList.add('active');
        }
        socket.on('play-meme', d => {
            if(!d.mediaUrl) return; showRedeem(d.redeemedBy||'Viewer', d.name);
            vid.src = d.mediaUrl; vBox.style.display = 'block'; vid.play();
            vid.onended = () => { vBox.style.display = 'none'; rCard.classList.remove('active'); };
        });
        socket.on('play-sfx', d => {
            if(!d.sfxUrl) return; showRedeem(d.redeemedBy||'Viewer', d.name);
            sfx.src = d.sfxUrl; sfx.play();
            setTimeout(() => rCard.classList.remove('active'), 5000);
        });

        // AI & Alerts Queue
        const queue = []; let processing = false;
        const tts = document.getElementById('tts-audio');
        
        function processQueue() {
            if(queue.length === 0) { processing = false; return; }
            processing = true; const data = queue.shift();
            
            let targetImg, targetBox;
            if (data.type === 'alert') {
                targetBox = document.getElementById('alert-box');
                targetImg = document.getElementById('alert-user-img');
                targetImg.src = data.avatar || 'https://cdn-icons-png.flaticon.com/512/847/847969.png';
                document.getElementById('alert-title').innerText = data.title;
                document.getElementById('alert-msg').innerText = data.msg;
            } else {
                if(!data.enableBubble) { 
                    if(data.enableTTS) playVoice(data.text, data.voice, null, () => setTimeout(processQueue, 500));
                    else { setTimeout(processQueue, 100); }
                    return; 
                }
                targetBox = document.getElementById('ai-container');
                targetImg = document.getElementById('ai-avatar');
                targetImg.src = data.characterImage || 'https://images3.alphacoders.com/134/1344406.jpeg';
                document.getElementById('ai-name').innerText = data.characterName || 'AI';
                document.getElementById('ai-text').innerText = data.text;
            }
            
            targetBox.style.display = 'flex';
            if (data.enableTTS !== false) {
                playVoice(data.text || data.msg, data.voice || 'female', targetImg, () => {
                    setTimeout(() => { targetBox.style.display = 'none'; processQueue(); }, 1500);
                });
            } else {
                setTimeout(() => { targetBox.style.display = 'none'; processQueue(); }, 5000);
            }
        }

        function playVoice(text, voice, imgEl, callback) {
            const clean = text.replace(/[*_#~`]/g, '').trim(); if(!clean) return callback();
            tts.src = `/api/tts?voice=${voice}&text=${encodeURIComponent(clean)}`;
            tts.onended = () => { if(imgEl) imgEl.classList.remove('talking-pulse'); callback(); };
            tts.onerror = callback;
            tts.play().then(() => { if(imgEl) imgEl.classList.add('talking-pulse'); }).catch(callback);
        }

        socket.on('ai-speak', d => { queue.push({ type: 'speak', ...d }); if(!processing) processQueue(); });
        socket.on('stream-alert', d => { 
            queue.push({ type: 'alert', title: `${d.type.toUpperCase()}: @${d.user}`, msg: d.msg || 'Thanks!', avatar: d.avatar, voice: d.voice }); 
            if(!processing) processQueue(); 
        });
    </script>
</body>
</html>

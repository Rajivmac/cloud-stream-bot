<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Death Counter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Black+Ops+One&family=Chakra+Petch:wght@600;700&family=Orbitron:wght@700&family=Press+Start+2P&family=Russo+One&family=Share+Tech+Mono&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: transparent;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        #counter-card {
            background: rgba(10, 13, 20, 0.94);
            border: 2px solid var(--theme-color, #ff4757);
            border-left: 6px solid var(--theme-color, #ff4757);
            padding: 8px 24px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px var(--theme-color, rgba(255, 71, 87, 0.3));
            font-family: var(--counter-font, 'Teko'), sans-serif;
            letter-spacing: 1.5px;
            transition: all 0.25s ease;
        }
        #skull-icon {
            font-size: 38px;
            animation: float 2.5s ease-in-out infinite;
        }
        .label {
            color: #dcdde1;
            font-size: 32px;
            text-transform: uppercase;
        }
        #death-count {
            color: var(--theme-color, #ff4757);
            font-size: 48px;
            font-weight: 700;
            transition: all 0.2s ease-in-out;
            display: inline-block;
        }
        .death-pulse {
            transform: scale(1.45);
            text-shadow: 0 0 25px #ffffff, 0 0 40px var(--theme-color, #ff4757);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
    </style>
</head>
<body>
    <div id="counter-card">
        <span id="skull-icon">💀</span>
        <span class="label">DEATHS:</span>
        <span id="death-count">0</span>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const iconSpan = document.getElementById('skull-icon');
        const deathSpan = document.getElementById('death-count');
        let currentCount = 0;

        socket.on('update-counter', (data) => {
            if (data.count > currentCount) {
                deathSpan.classList.add('death-pulse');
                setTimeout(() => deathSpan.classList.remove('death-pulse'), 400);
            }
            currentCount = data.count;
            deathSpan.innerText = data.count;
        });

        socket.on('update-styles', (data) => {
            if (data.counterIcon) iconSpan.innerText = data.counterIcon;
            if (data.counterFont) document.documentElement.style.setProperty('--counter-font', `'${data.counterFont}'`);
            if (data.themeColor) document.documentElement.style.setProperty('--theme-color', data.themeColor);
        });
    </script>
</body>
</html>

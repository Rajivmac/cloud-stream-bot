<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OBS AI Speech Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: transparent;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #ai-container {
            display: none;
            align-items: flex-start;
            gap: 16px;
            background: rgba(14, 18, 28, 0.95);
            border: 2px solid #00d2d3;
            border-radius: 16px;
            padding: 16px 20px;
            max-width: 550px;
            box-shadow: 0 8px 30px rgba(0, 210, 211, 0.4);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.7) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        #avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00d2d3;
            box-shadow: 0 0 15px rgba(0, 210, 211, 0.6);
            flex-shrink: 0;
            background: #0b0e14;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #bot-name {
            font-size: 15px;
            font-weight: 800;
            color: #00d2d3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #bot-text {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.4;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="ai-container">
        <img id="avatar" src="https://cdn-icons-png.flaticon.com/512/3233/3233514.png" alt="Avatar">
        <div class="content">
            <span id="bot-name">Son Goku</span>
            <div id="bot-text">Hello Stream!</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById('ai-container');
        const avatar = document.getElementById('avatar');
        const botName = document.getElementById('bot-name');
        const botText = document.getElementById('bot-text');

        let hideTimeout = null;
        let audioContext = null;
        let globalAudio = null;

        // Force Unlock Audio in OBS Chromium
        function unlockAudioEngine() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            } catch(e) {}
        }
        window.addEventListener('click', unlockAudioEngine);
        unlockAudioEngine();

        function playSoundWithFallback(primaryUrl, fallbackUrl, playbackRate) {
            unlockAudioEngine();

            if (globalAudio) {
                try { globalAudio.pause(); globalAudio.currentTime = 0; } catch(e) {}
                globalAudio = null;
            }

            globalAudio = new Audio();
            globalAudio.crossOrigin = "anonymous";
            globalAudio.volume = 1.0;
            globalAudio.playbackRate = playbackRate || 1.0;
            globalAudio.src = primaryUrl;

            const playPromise = globalAudio.play();

            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    // Fallback to Secondary Direct Cloud TTS Engine
                    if (fallbackUrl) {
                        globalAudio = new Audio(fallbackUrl);
                        globalAudio.volume = 1.0;
                        globalAudio.playbackRate = playbackRate || 1.0;
                        globalAudio.play().catch(err => console.error("All audio fallbacks failed:", err));
                    }
                });
            }
        }

        function speakCloudTTS(text, gender, pitch, rate) {
            const cleanText = text.replace(/[*_#~`]/g, '').trim();
            if (!cleanText) return;

            // Engine 1: StreamElements Cloud Voice
            const voice = (gender === 'female') ? 'Aditi' : 'Brian';
            const primaryUrl = `https://api.streamelements.com/kappa/v2/speech?voice=${voice}&text=${encodeURIComponent(cleanText.slice(0, 220))}`;

            // Engine 2: Google Instant Translate TTS (Guaranteed Autoplay in OBS)
            const lang = (gender === 'female') ? 'hi' : 'en';
            const fallbackUrl = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${lang}&q=${encodeURIComponent(cleanText.slice(0, 200))}`;

            const p = parseFloat(pitch) || 1.0;
            const r = parseFloat(rate) || 1.0;
            const calcSpeed = Math.max(0.7, Math.min(1.6, p * r));

            playSoundWithFallback(primaryUrl, fallbackUrl, calcSpeed);
        }

        socket.on('ai-speak', (data) => {
            if (data.enableBubble) {
                avatar.src = data.characterImage || 'https://cdn-icons-png.flaticon.com/512/3233/3233514.png';
                botName.innerText = data.characterName || 'Son Goku';
                botText.innerText = data.text;
                container.style.display = 'flex';

                if (hideTimeout) clearTimeout(hideTimeout);
                hideTimeout = setTimeout(() => {
                    container.style.display = 'none';
                }, 8500);
            }

            if (data.enableTTS) {
                speakCloudTTS(data.text, data.gender, data.pitch, data.rate);
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OBS AI Speech Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: transparent;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #ai-container {
            display: none;
            align-items: flex-start;
            gap: 16px;
            background: rgba(14, 18, 28, 0.95);
            border: 2px solid #00d2d3;
            border-radius: 16px;
            padding: 16px 20px;
            max-width: 550px;
            box-shadow: 0 8px 30px rgba(0, 210, 211, 0.4);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.7) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        #avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00d2d3;
            box-shadow: 0 0 15px rgba(0, 210, 211, 0.6);
            flex-shrink: 0;
            background: #0b0e14;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #bot-name {
            font-size: 15px;
            font-weight: 800;
            color: #00d2d3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #bot-text {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.4;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="ai-container">
        <img id="avatar" src="https://cdn-icons-png.flaticon.com/512/3233/3233514.png" alt="Avatar">
        <div class="content">
            <span id="bot-name">Son Goku</span>
            <div id="bot-text">Hello Stream!</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById('ai-container');
        const avatar = document.getElementById('avatar');
        const botName = document.getElementById('bot-name');
        const botText = document.getElementById('bot-text');

        let hideTimeout = null;
        let voices = [];
        let voiceMap = {};
        let currentUtterance = null;

        // 1. Indian Voices Initialization (2 Female & 2 Male)
        function initVoices() {
            if (!('speechSynthesis' in window)) return;
            voices = window.speechSynthesis.getVoices();
            if (!voices.length) return;

            voiceMap = {
                // Female 1: Hindi Accent (Swara / hi-IN)
                female_hi: voices.find(v => v.name.includes("Swara") || (v.lang === "hi-IN" && v.name.toLowerCase().includes("female"))) || 
                           voices.find(v => v.lang === "hi-IN") || voices[0],

                // Female 2: Indian English Accent (Neerja / en-IN)
                female_en: voices.find(v => v.name.includes("Neerja") || (v.lang === "en-IN" && v.name.toLowerCase().includes("female"))) || 
                           voices.find(v => v.lang === "en-IN") || voices[0],

                // Male 1: Hindi Accent (Madhur / hi-IN)
                male_hi: voices.find(v => v.name.includes("Madhur") || (v.lang === "hi-IN" && v.name.toLowerCase().includes("male"))) || 
                         voices.find(v => v.lang === "hi-IN") || voices[0],

                // Male 2: Indian English Accent (Prabhat / en-IN)
                male_en: voices.find(v => v.name.includes("Prabhat") || (v.lang === "en-IN" && v.name.toLowerCase().includes("male"))) || 
                         voices.find(v => v.lang === "en-IN") || voices[0]
            };
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = initVoices;
            initVoices();
        }

        // 2. Zero-Delay Direct Speech Player
        function speakIndianTTS(text, voiceType, rate, pitch) {
            if (!('speechSynthesis' in window)) return;

            // Purani queue flush karo taaki audio me bilkul delay na ho
            window.speechSynthesis.cancel();

            if (!voices.length) initVoices();

            const cleanText = text.replace(/[*_#~`]/g, '').trim();
            if (!cleanText) return;

            currentUtterance = new SpeechSynthesisUtterance(cleanText);

            // Correct Indian voice selection
            const key = voiceType || 'female_hi';
            const selected = voiceMap[key] || voiceMap['female_hi'] || voices[0];

            if (selected) {
                currentUtterance.voice = selected;
                currentUtterance.lang = selected.lang;
            }

            // Sliders Control: Speed & Tone Pitch
            currentUtterance.rate = Math.max(0.5, Math.min(2.0, parseFloat(rate) || 1.0));
            currentUtterance.pitch = Math.max(0.5, Math.min(1.8, parseFloat(pitch) || 1.0));

            currentUtterance.onend = () => { currentUtterance = null; };
            currentUtterance.onerror = () => { window.speechSynthesis.cancel(); };

            window.speechSynthesis.speak(currentUtterance);
        }

        socket.on('ai-speak', (data) => {
            if (data.enableBubble) {
                avatar.src = data.characterImage || 'https://cdn-icons-png.flaticon.com/512/3233/3233514.png';
                botName.innerText = data.characterName || 'Son Goku';
                botText.innerText = data.text;
                container.style.display = 'flex';

                if (hideTimeout) clearTimeout(hideTimeout);
                hideTimeout = setTimeout(() => {
                    container.style.display = 'none';
                }, 8500);
            }

            if (data.enableTTS) {
                speakIndianTTS(data.text, data.voice, data.rate, data.pitch);
            }
        });
    </script>
</body>
</html>

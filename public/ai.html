<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OBS AI Speech Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: transparent;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #ai-container {
            display: none;
            align-items: flex-start;
            gap: 16px;
            background: rgba(14, 18, 28, 0.95);
            border: 2px solid #00d2d3;
            border-radius: 16px;
            padding: 16px 20px;
            max-width: 550px;
            box-shadow: 0 8px 30px rgba(0, 210, 211, 0.4);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.7) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        #avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00d2d3;
            box-shadow: 0 0 15px rgba(0, 210, 211, 0.6);
            flex-shrink: 0;
            background: #0b0e14;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #bot-name {
            font-size: 15px;
            font-weight: 800;
            color: #00d2d3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #bot-text {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.4;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <audio id="tts-audio" style="display:none;"></audio>

    <div id="ai-container">
        <img id="avatar" src="https://cdn-icons-png.flaticon.com/512/3233/3233514.png" alt="Avatar">
        <div class="content">
            <span id="bot-name">Son Goku</span>
            <div id="bot-text">Hello Stream!</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById('ai-container');
        const avatar = document.getElementById('avatar');
        const botName = document.getElementById('bot-name');
        const botText = document.getElementById('bot-text');
        const audioPlayer = document.getElementById('tts-audio');

        let hideTimeout = null;
        let audioCtx = null;
        let biquadFilter = null;
        let sourceNode = null;

        function ensureWebAudioGraph() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    biquadFilter = audioCtx.createBiquadFilter();
                    biquadFilter.type = "peaking";
                    biquadFilter.frequency.value = 250;
                    biquadFilter.Q.value = 1.0;
                    
                    sourceNode = audioCtx.createMediaElementSource(audioPlayer);
                    sourceNode.connect(biquadFilter);
                    biquadFilter.connect(audioCtx.destination);
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) {}
        }

        function playRealStudioTTS(text, voice, pitch, rate) {
            const cleanText = text.replace(/[*_#~`]/g, '').trim();
            if (!cleanText) return;

            ensureWebAudioGraph();

            const selectedVoice = voice || 'Brian';
            const audioSrc = `/api/tts?voice=${selectedVoice}&text=${encodeURIComponent(cleanText)}&t=${Date.now()}`;

            audioPlayer.pause();
            audioPlayer.src = audioSrc;
            audioPlayer.volume = 1.0;

            const p = parseFloat(pitch) || 1.0;
            const r = parseFloat(rate) || 1.0;

            // Pitch Shifting Engine:
            // preservesPitch = false allows frequency scaling (lower = deep masculine bass, higher = sharp)
            audioPlayer.preservesPitch = false;
            audioPlayer.mozPreservesPitch = false;
            audioPlayer.webkitPreservesPitch = false;

            // Acoustic Frequency Bass/Treble booster
            if (biquadFilter) {
                if (p < 1.0) {
                    biquadFilter.frequency.value = 180;
                    biquadFilter.gain.value = (1.0 - p) * 16; // Rich deep vocal boost
                } else if (p > 1.0) {
                    biquadFilter.frequency.value = 2800;
                    biquadFilter.gain.value = (p - 1.0) * 12; // Sharp high tone boost
                } else {
                    biquadFilter.gain.value = 0;
                }
            }

            // Real acoustic scaling combining pitch & speed
            const finalRate = Math.max(0.55, Math.min(1.85, p * r));
            audioPlayer.playbackRate = finalRate;

            audioPlayer.play().catch(err => {
                console.error("Audio playback error:", err);
            });
        }

        socket.on('ai-speak', (data) => {
            if (data.enableBubble) {
                avatar.src = data.characterImage || 'https://cdn-icons-png.flaticon.com/512/3233/3233514.png';
                botName.innerText = data.characterName || 'Son Goku';
                botText.innerText = data.text;
                container.style.display = 'flex';

                if (hideTimeout) clearTimeout(hideTimeout);
                hideTimeout = setTimeout(() => {
                    container.style.display = 'none';
                }, 8500);
            }

            if (data.enableTTS) {
                playRealStudioTTS(data.text, data.voice, data.pitch, data.rate);
            }
        });
    </script>
</body>
</html>

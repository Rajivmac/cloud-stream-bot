<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Character Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: transparent;
            margin: 0;
            overflow: hidden;
            font-family: 'Chakra Petch', sans-serif;
        }
        #ai-bubble {
            position: absolute;
            bottom: 30px;
            left: 30px;
            max-width: 550px;
            background: rgba(11, 14, 22, 0.96);
            border: 2px solid var(--theme-color, #00d2d3);
            border-left: 6px solid var(--theme-color, #00d2d3);
            border-radius: 14px;
            padding: 14px 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.85), 0 0 25px rgba(0, 210, 211, 0.35);
            display: flex;
            gap: 16px;
            align-items: center;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #ai-bubble.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .avatar-frame {
            width: 70px;
            height: 70px;
            min-width: 70px;
            border-radius: 50%;
            border: 2px solid var(--theme-color, #00d2d3);
            box-shadow: 0 0 15px rgba(0, 210, 211, 0.5);
            overflow: hidden;
            background: #1a1e2e;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .content-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .sender-name {
            font-size: 13px;
            color: var(--theme-color, #00d2d3);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }
        .ai-text {
            color: #ffffff;
            font-size: 18px;
            line-height: 1.35;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>
    <div id="ai-bubble">
        <div class="avatar-frame">
            <img id="ai-avatar-img" class="avatar-img" src="" alt="avatar">
        </div>
        <div class="content-box">
            <span class="sender-name" id="ai-character-name">CHARACTER NAME</span>
            <span class="ai-text" id="ai-message">Message text...</span>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const bubble = document.getElementById('ai-bubble');
        const avatarImg = document.getElementById('ai-avatar-img');
        const charNameEl = document.getElementById('ai-character-name');
        const textEl = document.getElementById('ai-message');

        let hideTimeout;

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.05;
            utterance.pitch = 1.1;
            
            const voices = window.speechSynthesis.getVoices();
            const naturalVoice = voices.find(v => v.lang.includes('hi') || v.lang.includes('IN') || v.name.includes('Google'));
            if (naturalVoice) utterance.voice = naturalVoice;

            window.speechSynthesis.speak(utterance);
        }

        socket.on('ai-speak', (data) => {
            avatarImg.src = data.characterImage || 'https://api.dicebear.com/7.x/bottts/svg?seed=streamer';
            charNameEl.innerText = data.characterName || 'AI ASSISTANT';
            textEl.innerText = data.text;

            bubble.classList.add('active');

            if (data.enableTTS) {
                speakText(data.text);
            }

            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                bubble.classList.remove('active');
            }, 9000);
        });

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }
    </script>
</body>
</html>

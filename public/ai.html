<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OBS AI Speech Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: transparent;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #ai-container {
            display: none;
            align-items: flex-start;
            gap: 16px;
            background: rgba(14, 18, 28, 0.94);
            border: 2px solid #00d2d3;
            border-radius: 16px;
            padding: 16px 20px;
            max-width: 550px;
            box-shadow: 0 8px 30px rgba(0, 210, 211, 0.35);
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.7) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        #avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00d2d3;
            box-shadow: 0 0 15px rgba(0, 210, 211, 0.6);
            flex-shrink: 0;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #bot-name {
            font-size: 15px;
            font-weight: 800;
            color: #00d2d3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #bot-text {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.4;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="ai-container">
        <img id="avatar" src="" alt="Bot Avatar">
        <div class="content">
            <span id="bot-name">Son Goku</span>
            <div id="bot-text">Hello Stream!</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById('ai-container');
        const avatar = document.getElementById('avatar');
        const botName = document.getElementById('bot-name');
        const botText = document.getElementById('bot-text');

        let hideTimeout = null;
        let currentAudio = null;

        function speakCloudTTS(text, gender, rate) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            if (window.speechSynthesis) window.speechSynthesis.cancel();

            const voice = (gender === 'female') ? 'Aditi' : 'Brian';
            const cleanText = text.replace(/[*_#~]/g, '').trim();
            const url = `https://api.streamelements.com/kappa/v2/speech?voice=${voice}&text=${encodeURIComponent(cleanText.slice(0, 250))}`;

            currentAudio = new Audio(url);
            currentAudio.playbackRate = rate || 1.0;
            currentAudio.play().catch(err => {
                if ('speechSynthesis' in window) {
                    const u = new SpeechSynthesisUtterance(cleanText);
                    u.rate = rate || 1.0;
                    window.speechSynthesis.speak(u);
                }
            });
        }

        socket.on('ai-speak', (data) => {
            if (data.enableBubble) {
                avatar.src = data.characterImage || 'https://images2.alphacoders.com/131/1312384.png';
                botName.innerText = data.characterName || 'Son Goku';
                botText.innerText = data.text;
                container.style.display = 'flex';

                if (hideTimeout) clearTimeout(hideTimeout);
                // Bubble remains for 8 seconds
                hideTimeout = setTimeout(() => {
                    container.style.display = 'none';
                }, 8500);
            }

            if (data.enableTTS) {
                speakCloudTTS(data.text, data.gender, data.rate);
            }
        });
    </script>
</body>
</html>

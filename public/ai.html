<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OBS AI Speech Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: transparent;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #ai-container {
            display: none;
            align-items: flex-start;
            gap: 16px;
            background: rgba(14, 18, 28, 0.95);
            border: 2px solid #00d2d3;
            border-radius: 16px;
            padding: 16px 20px;
            max-width: 550px;
            box-shadow: 0 8px 30px rgba(0, 210, 211, 0.4);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.7) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        #avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00d2d3;
            box-shadow: 0 0 15px rgba(0, 210, 211, 0.6);
            flex-shrink: 0;
            background: #0b0e14;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #bot-name {
            font-size: 15px;
            font-weight: 800;
            color: #00d2d3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #bot-text {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.4;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <audio id="tts-audio" style="display:none;"></audio>

    <div id="ai-container">
        <img id="avatar" src="https://images3.alphacoders.com/134/1344406.jpeg" alt="Avatar">
        <div class="content">
            <span id="bot-name">Ryomen Sukuna</span>
            <div id="bot-text">Hello Stream!</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById('ai-container');
        const avatar = document.getElementById('avatar');
        const botName = document.getElementById('bot-name');
        const botText = document.getElementById('bot-text');
        const audioPlayer = document.getElementById('tts-audio');

        let hideTimeout = null;
        let audioCtx = null;
        let bassFilter = null;
        let trebleFilter = null;
        let sourceNode = null;

        function initToneEqualizer() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    
                    bassFilter = audioCtx.createBiquadFilter();
                    bassFilter.type = "lowshelf";
                    bassFilter.frequency.value = 220;

                    trebleFilter = audioCtx.createBiquadFilter();
                    trebleFilter.type = "highshelf";
                    trebleFilter.frequency.value = 2600;

                    sourceNode = audioCtx.createMediaElementSource(audioPlayer);
                    sourceNode.connect(bassFilter);
                    bassFilter.connect(trebleFilter);
                    trebleFilter.connect(audioCtx.destination);
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) {}
        }

        function playIndianVoice(text, voice, pitch, rate) {
            const cleanText = text.replace(/[*_#~`]/g, '').trim();
            if (!cleanText) return;

            initToneEqualizer();

            const isFemale = (voice || 'female').toLowerCase().includes('female');
            const selectedVoice = isFemale ? 'female' : 'male';
            const p = parseFloat(pitch) || 1.0;
            const r = Math.max(0.6, Math.min(1.8, parseFloat(rate) || 1.0));

            // TONE EQUALIZER (Independent of Speed)
            if (bassFilter && trebleFilter) {
                if (p < 1.0) {
                    bassFilter.gain.value = (1.0 - p) * 28;
                    trebleFilter.gain.value = -(1.0 - p) * 14;
                } else if (p > 1.0) {
                    bassFilter.gain.value = -(p - 1.0) * 14;
                    trebleFilter.gain.value = (p - 1.0) * 20;
                } else {
                    bassFilter.gain.value = 0;
                    trebleFilter.gain.value = 0;
                }
            }

            audioPlayer.preservesPitch = true;
            audioPlayer.pause();

            // Set playbackRate after metadata loads (Fixes HTML5 reset bug)
            audioPlayer.onloadedmetadata = () => {
                audioPlayer.playbackRate = r;
            };

            const primaryUrl = `/api/tts?voice=${selectedVoice}&text=${encodeURIComponent(cleanText)}&t=${Date.now()}`;
            audioPlayer.src = primaryUrl;
            audioPlayer.volume = 1.0;

            const playPromise = audioPlayer.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    audioPlayer.playbackRate = r;
                }).catch(() => {
                    // Fail-safe direct client fallback
                    const fallbackUrl = isFemale 
                        ? `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=hi&q=${encodeURIComponent(cleanText)}`
                        : `https://api.streamelements.com/kappa/v2/speech?voice=Brian&text=${encodeURIComponent(cleanText)}`;
                    audioPlayer.src = fallbackUrl;
                    audioPlayer.play().then(() => {
                        audioPlayer.playbackRate = r;
                    }).catch(e => console.error("Audio fallback failed:", e));
                });
            }
        }

        socket.on('ai-speak', (data) => {
            if (data.enableBubble) {
                avatar.src = data.characterImage || 'https://images3.alphacoders.com/134/1344406.jpeg';
                botName.innerText = data.characterName || 'Bot';
                botText.innerText = data.text;
                container.style.display = 'flex';

                if (hideTimeout) clearTimeout(hideTimeout);
                hideTimeout = setTimeout(() => {
                    container.style.display = 'none';
                }, 8500);
            }

            if (data.enableTTS) {
                playIndianVoice(data.text, data.voice, data.pitch, data.rate);
            }
        });
    </script>
</body>
</html>

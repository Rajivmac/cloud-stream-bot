<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OBS AI Speech & Alerts Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: transparent;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #ai-container {
            display: none;
            align-items: flex-start;
            gap: 16px;
            background: rgba(14, 18, 28, 0.95);
            border: 2px solid #00d2d3;
            border-radius: 16px;
            padding: 16px 20px;
            max-width: 550px;
            box-shadow: 0 8px 30px rgba(0, 210, 211, 0.4);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 12px;
        }

        /* 🌟 SUPER CHAT & MEMBER GOLDEN ALERT BANNER */
        #alert-box {
            display: none;
            flex-direction: column;
            gap: 6px;
            background: linear-gradient(135deg, rgba(241, 196, 15, 0.95), rgba(230, 126, 34, 0.95));
            border: 3px solid #ffffff;
            border-radius: 16px;
            padding: 16px 22px;
            max-width: 500px;
            color: #000;
            box-shadow: 0 0 35px rgba(241, 196, 15, 0.8);
            animation: alertPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes alertPop {
            0% { transform: scale(0.6) translateY(-30px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes popIn {
            0% { transform: scale(0.7) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .alert-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 17px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .alert-amount {
            background: #000;
            color: #f1c40f;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 900;
        }

        .alert-body {
            font-size: 15px;
            font-weight: 700;
            color: #111;
            line-height: 1.3;
        }

        #avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00d2d3;
            box-shadow: 0 0 15px rgba(0, 210, 211, 0.6);
            flex-shrink: 0;
            background: #0b0e14;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #bot-name {
            font-size: 15px;
            font-weight: 800;
            color: #00d2d3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #bot-text {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.4;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <audio id="tts-audio" style="display:none;"></audio>

    <!-- SUPER CHAT & MEMBER BANNER -->
    <div id="alert-box">
        <div class="alert-header">
            <span id="alert-title">🎉 SUPER CHAT!</span>
            <span id="alert-val" class="alert-amount">₹500</span>
        </div>
        <div class="alert-body" id="alert-msg">Rahul Gamer: Keep grinding boss!</div>
    </div>

    <!-- AI BUBBLE OVERLAY -->
    <div id="ai-container">
        <img id="avatar" src="https://images3.alphacoders.com/134/1344406.jpeg" alt="Avatar">
        <div class="content">
            <span id="bot-name">Ryomen Sukuna</span>
            <div id="bot-text">Hello Stream!</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById('ai-container');
        const avatar = document.getElementById('avatar');
        const botName = document.getElementById('bot-name');
        const botText = document.getElementById('bot-text');
        const audioPlayer = document.getElementById('tts-audio');

        const alertBox = document.getElementById('alert-box');
        const alertTitle = document.getElementById('alert-title');
        const alertVal = document.getElementById('alert-val');
        const alertMsg = document.getElementById('alert-msg');

        let hideTimeout = null;
        let alertTimeout = null;
        let audioCtx = null;
        let bassFilter = null;
        let trebleFilter = null;
        let sourceNode = null;
        let currentRate = 1.0;

        function initToneEqualizer() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    
                    bassFilter = audioCtx.createBiquadFilter();
                    bassFilter.type = "lowshelf";
                    bassFilter.frequency.value = 220;

                    trebleFilter = audioCtx.createBiquadFilter();
                    trebleFilter.type = "highshelf";
                    trebleFilter.frequency.value = 2600;

                    sourceNode = audioCtx.createMediaElementSource(audioPlayer);
                    sourceNode.connect(bassFilter);
                    bassFilter.connect(trebleFilter);
                    trebleFilter.connect(audioCtx.destination);
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) {}
        }

        function playVoice(text, voice, pitch, rate) {
            const cleanText = text.replace(/[*_#~`]/g, '').trim();
            if (!cleanText) return;

            initToneEqualizer();

            const isFemale = (voice || 'female').toLowerCase().includes('female');
            const selectedVoice = isFemale ? 'female' : 'male';
            const p = parseFloat(pitch) || 1.0;
            currentRate = Math.max(0.6, Math.min(1.8, parseFloat(rate) || 1.0));

            // TONE EQUALIZER: Alters bass/treble resonance without touching speed
            if (bassFilter && trebleFilter) {
                if (p < 1.0) {
                    bassFilter.gain.value = (1.0 - p) * 28;
                    trebleFilter.gain.value = -(1.0 - p) * 14;
                } else if (p > 1.0) {
                    bassFilter.gain.value = -(p - 1.0) * 14;
                    trebleFilter.gain.value = (p - 1.0) * 20;
                } else {
                    bassFilter.gain.value = 0;
                    trebleFilter.gain.value = 0;
                }
            }

            audioPlayer.preservesPitch = true;
            audioPlayer.pause();
            audioPlayer.crossOrigin = "anonymous";

            const applySpeed = () => {
                try { audioPlayer.playbackRate = currentRate; } catch(e) {}
            };

            audioPlayer.onloadedmetadata = applySpeed;
            audioPlayer.onplay = applySpeed;
            audioPlayer.onplaying = applySpeed;

            audioPlayer.src = `/api/tts?voice=${selectedVoice}&text=${encodeURIComponent(cleanText)}&t=${Date.now()}`;
            audioPlayer.volume = 1.0;

            const playPromise = audioPlayer.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    applySpeed();
                }).catch(err => {
                    console.error("Audio play error:", err);
                });
            }
        }

        socket.on('ai-speak', (data) => {
            if (data.enableBubble) {
                avatar.src = data.characterImage || 'https://images3.alphacoders.com/134/1344406.jpeg';
                botName.innerText = data.characterName || 'Bot';
                botText.innerText = data.text;
                container.style.display = 'flex';

                if (hideTimeout) clearTimeout(hideTimeout);
                hideTimeout = setTimeout(() => {
                    container.style.display = 'none';
                }, 8500);
            }

            if (data.enableTTS) {
                playVoice(data.text, data.voice, data.pitch, data.rate);
            }
        });

        // 🌟 ON-SCREEN ALERT LISTENER
        socket.on('stream-alert', (data) => {
            if (data.type === 'superchat') {
                alertTitle.innerText = `💰 SUPER CHAT: @${data.user}`;
                alertVal.innerText = data.amount;
                alertMsg.innerText = data.msg || 'Thanks for supporting the stream!';
            } else if (data.type === 'member') {
                alertTitle.innerText = `👑 NEW MEMBER: @${data.user}`;
                alertVal.innerText = 'MEMBER';
                alertMsg.innerText = 'Welcome to the channel family!';
            }

            alertBox.style.display = 'flex';
            if (alertTimeout) clearTimeout(alertTimeout);
            alertTimeout = setTimeout(() => {
                alertBox.style.display = 'none';
            }, 8000);
        });
    </script>
</body>
</html>

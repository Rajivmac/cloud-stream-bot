<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stream Clock HUD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Black+Ops+One&family=Chakra+Petch:wght@600;700&family=Orbitron:wght@700&family=Press+Start+2P&family=Russo+One&family=Share+Tech+Mono&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: transparent;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        .hud-line {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            background: rgba(10, 13, 20, 0.94);
            border: 2px solid var(--theme-color, #ff4757);
            border-bottom: 4px solid var(--theme-color, #ff4757);
            border-radius: 8px;
            padding: 10px 24px;
            color: #ffffff;
            font-family: var(--clock-font, 'Share Tech Mono'), monospace;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.5);
            transition: all 0.25s ease;
        }
        .live-dot {
            width: 12px;
            height: 12px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 12px #2ecc71;
            animation: pulse 1.5s infinite;
        }
        .divider {
            color: rgba(255, 255, 255, 0.3);
        }
        .time-highlight {
            color: var(--theme-color, #ff4757);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div class="hud-line">
        <div class="live-dot"></div>
        <span id="date-part">--/--/----</span>
        <span class="divider">|</span>
        <span id="time-part" class="time-highlight">--:--:--</span>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function updateClock() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-GB', {
                day: '2-digit',
                month: 'short',
                year: 'numeric'
            });
            const timeStr = now.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });

            document.getElementById('date-part').innerText = dateStr;
            document.getElementById('time-part').innerText = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        socket.on('update-styles', (data) => {
            if (data.clockFont) document.documentElement.style.setProperty('--clock-font', `'${data.clockFont}'`);
            if (data.themeColor) document.documentElement.style.setProperty('--theme-color', data.themeColor);
        });
    </script>
</body>
</html>

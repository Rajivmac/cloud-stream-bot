<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stream Clock Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body {
            background-color: transparent;
            margin: 0;
            overflow: hidden;
            font-family: 'Share Tech Mono', monospace;
        }
        .hud-line {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(10, 12, 18, 0.75);
            border: 1px solid rgba(52, 152, 219, 0.4);
            border-radius: 6px;
            padding: 6px 16px;
            color: #ecf0f1;
            font-size: 18px;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 8px #2ecc71;
            animation: blink 1.5s infinite;
        }
        .divider {
            color: #7f8c8d;
        }
        .time-highlight {
            color: #00d2d3;
            font-weight: bold;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="hud-line">
        <div class="live-dot"></div>
        <span id="date-part">--/--/----</span>
        <span class="divider">|</span>
        <span id="time-part" class="time-highlight">--:--:--</span>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            // Format: DD MMM YYYY (e.g. 01 Oct 2026)
            const dateStr = now.toLocaleDateString('en-GB', {
                day: '2-digit',
                month: 'short',
                year: 'numeric'
            });

            // Format: 12-hour with AM/PM (e.g. 02:25:10 AM)
            const timeStr = now.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });

            document.getElementById('date-part').innerText = dateStr;
            document.getElementById('time-part').innerText = timeStr;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meme & SFX Overlay</title>
    <style>
        body {
            background-color: transparent;
            margin: 0;
            overflow: hidden;
        }
        #media-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        video {
            max-width: 650px;
            max-height: 650px;
            border-radius: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="media-container">
        <video id="meme-video"></video>
    </div>
    <audio id="sfx-audio"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const videoElement = document.getElementById('meme-video');
        const audioElement = document.getElementById('sfx-audio');

        // Video Meme Listener
        socket.on('play-meme', (data) => {
            videoElement.src = data.mediaUrl;
            videoElement.style.display = 'block';
            videoElement.play();

            videoElement.onended = () => {
                videoElement.style.display = 'none';
                videoElement.src = '';
            };
        });

        // Sound Effects (SFX) Listener
        socket.on('play-sfx', (data) => {
            audioElement.src = data.sfxUrl;
            audioElement.currentTime = 0;
            audioElement.play();
        });
    </script>
</body>
</html>

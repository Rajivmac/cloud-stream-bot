<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meme Overlay</title>
    <style>
        body {
            background-color: transparent;
            margin: 0;
            overflow: hidden;
        }
        #media-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        video {
            max-width: 600px;
            max-height: 600px;
            border-radius: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="media-container">
        <video id="meme-video"></video>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const videoElement = document.getElementById('meme-video');

        socket.on('play-meme', (data) => {
            videoElement.src = data.mediaUrl;
            videoElement.style.display = 'block';
            videoElement.play();

            videoElement.onended = () => {
                videoElement.style.display = 'none';
                videoElement.src = '';
            };
        });
    </script>
</body>
</html>

<!-- AI -->
<section id="t-ai" class="tab">
  <div class="card"><h3>🎭 AI Character & Keys</h3>
    <div class="g2" style="margin-bottom:8px">
      <div><label>Groq API Key (Fast LLM)</label><input id="ai-groq" type="password" placeholder="gsk_..."></div>
      <div><label>Tavily API Key (Web Search)</label><input id="ai-tavily" type="password" placeholder="tvly-..."></div>
    </div>
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:8px">
      <img id="pv" class="pv" alt="">
      <div style="flex:1"><label>Avatar image URL</label><input id="ai-img" style="margin:0" oninput="$('pv').src=this.value"></div>
    </div>
    <label>Voice</label>
    <select id="ai-voice"><option value="female">👩 Female (Hindi)</option><option value="male">👨 Male</option></select>
    <div class="g2">
      <div><label>Pitch (<span id="pitch-v">1</span>)</label><input id="ai-pitch" type="range" min="0.6" max="1.5" step="0.05" value="1" oninput="$('pitch-v').textContent=this.value"></div>
      <div><label>Speed (<span id="rate-v">1</span>)</label><input id="ai-rate" type="range" min="0.6" max="1.6" step="0.05" value="1" oninput="$('rate-v').textContent=this.value"></div>
    </div>
    <label>Character name</label><input id="ai-name" placeholder="AI">
    <label>Behaviour prompt</label><textarea id="ai-persona" rows="3"></textarea>
  </div>
  <div class="card"><h3>🤖 !ai command</h3>
    <div class="g2"><div><label>Trigger</label><input id="ai-cmd" value="!ai"></div><div><label>Coin cost</label><input id="ai-cost" type="number" value="50"></div></div>
    <label class="chk"><input id="ai-tts" type="checkbox" checked> 🔊 TTS me bolo</label>
    <label class="chk"><input id="ai-bubble" type="checkbox" checked> 💬 Screen bubble dikhao</label>
  </div>
  <div class="g2"><button class="gold" onclick="saveAI()">💾 Save</button><button style="background:#e67e22" onclick="emit('admin-test-speak')">🔊 Test voice</button></div>
</section>
